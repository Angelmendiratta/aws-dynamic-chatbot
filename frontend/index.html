<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloud Ladder Consulting — Booking Assistant</title>
<meta name="description" content="Chat with Cloud Ladder Consulting to book a product consultation, a sales call, or cloud & IT services help." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ───────── App shell ───────── -->
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">CL</div>
        <div class="brand-text">
          <h1>Cloud Ladder Consulting</h1>
          <p>Booking assistant</p>
        </div>
      </div>

      <div class="topbar-right">
        <!-- Active bot badge (shown/hidden by script.js → setBadge) -->
        <div class="bot-badge" id="botBadge" style="display:none">
          <span class="bot-badge-dot" id="botBadgeDot"></span>
          <span id="botBadgeName"></span>
        </div>
        <button class="ghost-btn" onclick="Chat.showDemo()">▶ Demo video</button>
        <button class="ghost-btn" onclick="Chat.reset()">↺ New Booking</button>
      </div>
    </header>

    <!-- ───────── Chat transcript ───────── -->
    <main class="chat" id="messages" aria-live="polite"></main>

    <!-- Typing indicator (toggled by script.js) -->
    <div class="typing-slot" id="typing" style="display:none">
      <div class="typing">
        <span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>
      </div>
    </div>

    <!-- ───────── Composer ───────── -->
    <footer class="composer">
      <input
        id="userInput"
        type="text"
        autocomplete="off"
        placeholder="Tell me what you need…"
        onkeydown="Chat.handleKey(event)" />
      <button id="sendBtn" class="send-btn" onclick="Chat.send()" aria-label="Send">➤</button>
    </footer>
  </div>

  <!-- ───────── Restart confirmation modal ───────── -->
  <div class="modal" id="restartModal" style="display:none">
    <div class="modal-card">
      <h3>Start over?</h3>
      <p>This clears the chat and any form you've started.</p>
      <div class="modal-btns">
        <button class="form-btn secondary" onclick="Chat.cancelRestart()">Cancel</button>
        <button class="form-btn primary" onclick="Chat.confirmRestart()">Yes, restart</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
